<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabkeep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <span class="logo-dot"></span>
        <h1>tabkeep</h1>
      </div>
      <p class="subtitle">Simpan kumpulan tab berdasarkan konteks</p>
    </header>

    <section class="card">
      <div class="card-header">
        <div class="card-title-group">
          <span class="card-title">Simpan sesi</span>
          <span class="card-subtitle">Bebaskan ruang tanpa kehilangan tab penting</span>
        </div>
        <span class="pill">
          <span class="pill-dot"></span>
          <span id="tabCount">0 tab terdeteksi</span>
        </span>
      </div>
      <div class="input-group">
        <div class="input-wrapper">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 2.5L12.2451 7.40983H17.5106L13.1327 10.6803L14.8779 15.5902L10 12.3197L5.12215 15.5902L6.86729 10.6803L2.48944 7.40983H7.75486L10 2.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
          <input type="text" id="contextName" placeholder="Kasih nama konteks, ex. Skripsi Bab 2" maxlength="40" autocomplete="off">
        </div>
      </div>
      <div class="actions">
        <button id="saveBtn" class="btn btn-primary">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 4.16667V15.8333" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.16663 10H15.8333" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Simpan semua tab di window ini
        </button>
      </div>
    </section>

    <section>
      <div class="list-header">
        <div class="list-title-group">
          <span class="list-title">Grup tersimpan</span>
          <span class="list-subtitle">Pilih konteks buat buka lagi nanti</span>
        </div>
      </div>
      <div class="sessions-list" id="sessionsList"></div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-state-icon">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.16663 5.83333H15.8333" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M6.66663 9.16667H13.3333" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M8.33337 12.5H11.6667" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="empty-state-title">Belum ada grup tersimpan</div>
        <div class="empty-state-subtitle">Simpan konteks pertamamu biar tab tetap rapi</div>
      </div>
    </section>

    <footer class="footer-note">Local-first • Tanpa login</footer>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/popup.js"></script>
</body>
</html>
